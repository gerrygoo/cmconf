# ============================================
# Basic Settings
# ============================================

# Enable mouse support (tmux 2.1+)
set -g mouse on

# Set default terminal to support 256 colors
set -g default-terminal "screen-256color"

# Enable true color support (if your terminal supports it)
set -ga terminal-overrides ",*256col*:Tc"

# Start window and pane numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000


# ============================================
# Vim-Style Key Bindings
# ============================================

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode (tmux 2.4+)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle


# ============================================
# Quality of Life Improvements
# ============================================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and - (more intuitive than " and %)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# unbind '"'
# unbind %

# Open new windows in the current path, after the current window
bind c new-window -a -c "#{pane_current_path}"

# Reduce escape time (good for vim/neovim)
set -sg escape-time 10

# Don't rename windows automatically
set -g allow-rename off


# ============================================
# Status Bar
# ============================================

# Status bar on by default
set -g status on

# Center window list
# set -g status-justify centre

# Simple status bar style
# set -g status-style 'bg=default,fg=white'
# set -g status-left '[#S] '
# set -g status-right '%Y-%m-%d %H:%M '

# ============================================
# Theme
# ============================================

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ============================================
# Plugin manager ._.
# https://github.com/tmux-plugins/tpm
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
